
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100719">
<title>THENNAL ❤️ Connect Hearts</title>
<style>
*{box-sizing:border-box}
:root{--pink:#ff3d9a;--purple:#a855f7;--dark:#0b0613;--panel:#1b1028}
body{margin:0;background:radial-gradient(ellipse at top,#351044,#100719 65%);color:white;font-family:Arial,sans-serif}
header{background:#170c22;padding:15px;text-align:center;border-bottom:1px solid var(--pink);box-shadow:0 0 22px #ff3d9a55}
header h1{color:#ff65b0;letter-spacing:6px;text-shadow:0 0 12px #ff3d9a;margin:8px}
header img{width:75px;height:75px;object-fit:contain}
header p{color:#edc9ff}
main{max-width:950px;margin:auto;padding:15px}
.card{background:linear-gradient(145deg,#271633,#160d22);padding:20px;border:1px solid #873c89;border-radius:20px;margin:12px 0;box-shadow:0 0 18px #a855f722}
input,textarea,select{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #a855f7;background:#100a1b;color:white}
button{padding:12px 18px;border:1px solid #ff8ac4;border-radius:25px;background:linear-gradient(100deg,#ff2789,#a43cff);color:white;font-weight:bold;margin:5px;cursor:pointer}
button.secondary{background:#39264e}
nav{display:flex;flex-wrap:wrap;justify-content:center;background:#100a1b;padding:10px;position:sticky;top:0;z-index:5}
nav button{font-size:12px;padding:10px}
.hidden{display:none!important}
.small{color:#d5b8e8;font-size:13px}
h2{color:#ff80bd}
.profile{display:flex;gap:15px;align-items:center}
.avatar{width:85px;height:85px;border-radius:50%;object-fit:cover;border:2px solid #ff3d9a}
#auth{max-width:420px;margin:25px auto}
#messages{height:300px;overflow:auto;background:#100a1b;padding:12px;border-radius:12px}
.msg{padding:9px;margin:6px;border-radius:12px;background:#392747;max-width:85%;overflow-wrap:anywhere}
.mine{margin-left:auto;background:#922c72}
video{width:100%;max-width:350px;background:black;border-radius:12px}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.menu-item{background:linear-gradient(145deg,#39204d,#1b1028);border:1px solid #a855f7;border-radius:17px;padding:18px 8px;text-align:center;cursor:pointer}
.menu-item strong{display:block;color:#ff80bd;margin-top:8px}
.discover-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#swipeCard{max-width:430px;margin:15px auto;padding:12px;background:linear-gradient(145deg,#39204d,#160d22);border:1px solid #ff3d9a;border-radius:22px;text-align:center;touch-action:pan-y}
#swipeCard img{width:100%;height:390px;object-fit:cover;border-radius:16px}
.swipe-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}
.feature-note{border:1px dashed #a855f7;border-radius:14px;padding:15px;color:#e6c9f5}
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle,#421052,#090514 70%);animation:splashFade 3s forwards}
#splash img{width:170px;height:170px;object-fit:contain}
#splash h1{color:#ff64b1;letter-spacing:8px}
@keyframes splashFade{0%,75%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden;
