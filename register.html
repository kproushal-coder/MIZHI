<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIZHI Registration</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#100d20;color:white;
font-family:Arial,sans-serif;
display:flex;justify-content:center;
align-items:center;min-height:100vh;padding:20px
}
.card{
width:100%;max-width:420px;
background:#211b35;padding:28px;
border-radius:22px;text-align:center
}
h1{color:#ff6399;letter-spacing:5px}
p{color:#c9bbd5}
input,select{
width:100%;padding:14px;margin:8px 0;
border:1px solid #514263;border-radius:12px;
background:#171326;color:white;font-size:15px
}
button{
width:100%;padding:15px;border:0;
border-radius:25px;background:#ff5790;
color:white;font-weight:bold;font-size:16px;
margin-top:15px
}
</style>
</head>
<body>
<div class="card">
<h1>MIZHI ❤️</h1>
<p>Create Your Account</p>
<form onsubmit="event.preventDefault();alert('Registration system will be connected soon!')">
<input type="text" placeholder="Full Name" required>
<input type="email" placeholder="Email Address" required>
<input type="tel" placeholder="Phone Number" required>
<input type="date" required>
<select required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>
<input type="password" placeholder="Create Password" required minlength="8">
<input type="password" placeholder="Confirm Password" required minlength="8">
<button type="submit">CREATE ACCOUNT ❤️</button>
</form>
<p>Welcome to MIZHI!</p>
</div>
</body>
</html>
