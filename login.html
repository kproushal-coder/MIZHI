<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIZHI Login</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#100d20;color:white;
font-family:Arial,sans-serif;
display:flex;align-items:center;
justify-content:center;min-height:100vh;
padding:20px
}
.card{
width:100%;max-width:400px;
background:#211b35;padding:30px;
border-radius:22px;text-align:center
}
h1{color:#ff6399;letter-spacing:5px}
p{color:#c9bbd5}
input{
width:100%;padding:15px;margin:10px 0;
border:1px solid #514263;border-radius:12px;
background:#171326;color:white;font-size:16px
}
button{
width:100%;padding:15px;border:0;
border-radius:25px;background:#ff5790;
color:white;font-weight:bold;font-size:16px;
margin-top:15px
}
</style>
</head>
<body>
<div class="card">
<h1>MIZHI ❤️</h1>
<p>Connect Hearts • Find Your Soulmate</p>
<h2>Welcome Back</h2>
<form onsubmit="event.preventDefault();alert('Login system will be connected soon!')">
<input type="email" placeholder="Email Address" required>
<input type="password" placeholder="Password" required>
<button type="submit">LOGIN</button>
</form>
<p>New to MIZHI? Create your account soon!</p>
</div>
</body>
</html>
